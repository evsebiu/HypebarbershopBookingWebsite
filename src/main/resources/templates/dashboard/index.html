<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | HypeBarbershop</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" th:href="@{/css/styles.css?v=150}">

    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

</head>

<body>

<div class="dashboard-header-compact" style="padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; position: sticky; top: 0; z-index: 50;">
    <div class="user-welcome">
        <span class="text-muted" style="font-size: 0.8rem;">Salut,</span>
        <h2 th:text="${currentUser}" style="margin:0; font-size: 1.1rem; color: #fff; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</h2>
    </div>

    <div style="display: flex; gap: 10px;">
        <a th:href="@{/dashboard/schedule}" class="btn-icon" style="background: rgba(212, 175, 55, 0.1); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.3); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; text-decoration: none;">
            🕒
        </a>
        <a th:href="@{/logout}" class="btn-icon" style="background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; text-decoration: none;">
            ⏻
        </a>
    </div>
</div>

<main class="dashboard-container" style="padding: 0 15px;">

    <div th:if="${nextApp != null}" id="next-app-focus-section" class="focus-card" style="margin-bottom: 25px;">
        <span style="color: #d4af37; ...">Următorul Client</span>
        <div class="appointment-card focus-highlight" ...>
            <div class="card-content" style="padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 id="focus-client-name" th:text="${nextApp.clientName}" ...>Nume Client</h2>
                        <p style="color: #d4af37; ...">
                            🕒 <span id="focus-start-time" th:text="${#temporals.format(nextApp.startTime, 'HH:mm')}">14:00</span>
                            - <span id="focus-service-name" th:text="${nextApp.serviceName}">Tuns</span>
                        </p>
                    </div>
                    <div id="focus-actions" style="display: flex; gap: 10px;">
                        <a id="focus-tel" th:href="'tel:' + ${nextApp.phoneNumber}" class="btn-action-round">📞</a>
                        <a id="focus-whatsapp" th:href="'https://wa.me/40' + ${nextApp.phoneNumber}" class="btn-action-round" style="background: #25D366;">📱</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="no-next-app-message" th:style="${nextApp == null ? 'display:block' : 'display:none'}" style="text-align:center; padding:20px; color:#666;">
        ☕ Nu mai ai programări pentru azi.
    </div>

    <div class="dashboard-card glass-effect" style="padding: 10px; border-radius: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.02);">
        <div id='calendar-full'></div>
    </div>

    <h4 id="selected-date-title" style="text-align: center; margin: 15px 0; color: #d4af37; font-size: 0.9rem;">
        Programări pentru <span></span>
    </h4>
    <div id="appointments-container" class="appointments-grid">
    </div>

    </div>

    <div id="tab-services" class="tab-content" style="display: none;">
        <h3 class="section-divider-title" style="color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">✂️ Servicii</h3>

        <div class="dashboard-card glass-effect" style="background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333;">
            <h4 style="color: #d4af37; margin: 0 0 15px 0;">Adaugă Serviciu</h4>
            <form th:action="@{/dashboard/services/add}" method="post">
                <input type="text" name="serviceName" placeholder="Nume Serviciu" required
                       style="width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; margin-bottom: 10px;">

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="number" name="price" placeholder="Preț (RON)" required
                           style="flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px;">
                    <input type="number" name="duration" placeholder="Min" required
                           style="flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px;">
                </div>
                <button type="submit" class="btn-cta" style="width: 100%; padding: 12px; background: #d4af37; color: #000; font-weight: bold; border: none; border-radius: 6px;">SALVEAZĂ</button>
            </form>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div th:each="service : ${myServices}" class="glass-effect" style="background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 th:text="${service.serviceName}" style="margin: 0; color: #eee;">Tuns</h4>
                    <span style="font-size: 0.8rem; color: #888;">⏱️ <span th:text="${service.duration}">30</span> min</span>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="color: #d4af37; font-weight: bold; font-size: 1.1rem;" th:text="${service.price} + ' RON'">50</span>
                    <form th:action="@{/dashboard/services/delete/{id}(id=${service.id})}" method="post" style="margin:0;">
                        <button type="submit" style="background: rgba(244, 67, 54, 0.1); color: #F44336; border: 1px solid rgba(244, 67, 54, 0.3); width: 35px; height: 35px; border-radius: 8px; cursor: pointer;">🗑️</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <div th:if="${isAdminView}" id="tab-admin" class="tab-content" style="display: none;">
        <h3 class="section-divider-title" style="color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">👥 Echipa</h3>

        <div class="dashboard-card glass-effect" style="background: #1a1a1a; padding: 10px; border-radius: 12px; border: 1px solid #333;">
            <div class="table-responsive">
                <table class="barbers-table" style="width: 100%; border-collapse: collapse; color: #ddd;">
                    <thead>
                    <tr style="border-bottom: 1px solid #333;">
                        <th style="text-align: left; padding: 10px; color: #d4af37;">Nume</th>
                        <th style="text-align: left; padding: 10px; color: #d4af37;">Status</th>
                        <th style="text-align: right; padding: 10px; color: #d4af37;">Acțiune</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="barber : ${allBarbers}" style="border-bottom: 1px solid #222;">
                        <td th:text="${barber.firstName}" style="padding: 15px 10px;">Nume</td>
                        <td style="padding: 15px 10px;">
                                <span th:text="${barber.isActive ? 'Activ' : 'Inactiv'}"
                                      th:style="${barber.isActive ? 'color:#4CAF50' : 'color:#F44336'}">Status</span>
                        </td>
                        <td style="padding: 15px 10px; text-align: right;">
                            <form th:action="@{/admin/barbers/toggle/{id}(id=${barber.id})}" method="post" style="margin:0;">
                                <button style="background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 4px;">Switch</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div style="height: 100px;"></div>

</main>


<nav class="bottom-nav glass-effect" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(212, 175, 55, 0.2); display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);">

    <button class="nav-item active" onclick="switchTab('tab-appointments', this)" style="background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;">
        <span class="nav-icon" style="font-size: 1.4rem;">📅</span>
        <span class="nav-label" style="font-size: 0.7rem;">Calendar</span>
    </button>

    <button class="nav-item" onclick="switchTab('tab-list-view', this)">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Programări</span>
    </button>

    <button class="nav-item" onclick="switchTab('tab-services', this)" style="background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;">
        <span class="nav-icon" style="font-size: 1.4rem;">✂️</span>
        <span class="nav-label" style="font-size: 0.7rem;">Servicii</span>
    </button>

    <button th:if="${isAdminView}" class="nav-item" onclick="switchTab('tab-admin', this)" style="background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;">
        <span class="nav-icon" style="font-size: 1.4rem;">👥</span>
        <span class="nav-label" style="font-size: 0.7rem;">Echipă</span>
    </button>
</nav>

<script>
    // 1. FUNCȚII GLOBALE (Sunt în afara DOMContentLoaded ca să poată fi apelate de butoane)
function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).style.display = 'block';
    btnElement.classList.add('active');
}

function deleteAppointmentPermanently(id) {
    if(!confirm("Ești sigur că vrei să ȘTERGI DEFINITIV această programare? Nu poate fi recuperată.")) return;

    fetch(`/dashboard/appointment/delete/${id}`, { method: 'POST' })
        .then(res => {
            if (res.ok) {
                const activeDate = document.querySelector('#selected-date-title span').innerText;
                // Reîncărcăm datele (această funcție este definită în interiorul DOMContentLoaded)
                window.location.reload();
            } else {
                alert("Eroare la ștergere.");
            }
        });
}

function updateStatus(id, action) {
    if(!confirm("Ești sigur?")) return;

    fetch(`/dashboard/appointment/${action}/${id}`, { method: 'POST' })
        .then(res => {
            if (res.ok) {
            // Aceasta este cheia: reîncărcăm datele zilei selectate
            const activeDate = document.querySelector('#selected-date-title span').innerText;
            window.fetchAppointments(activeDate);

            updateFocusCard();

        } else {
            alert("Eroare la server.");
        }
        });
}

function parseJavaTime(startTime) {
    if (!startTime) return "00:00";
    if (typeof startTime === 'string' && startTime.includes('T')) return startTime.split('T')[1].substring(0, 5);
    if (Array.isArray(startTime)) return `${String(startTime[3]).padStart(2, '0')}:${String(startTime[4]).padStart(2, '0')}`;
    return "00:00";
}
function updateFocusCard() {
    fetch('/dashboard/next-appointment-data')
        .then(res => {
            if (res.status === 204) return null;
            return res.json();
        })
        .then(app => {
            const section = document.getElementById('next-app-focus-section');
            const emptyMsg = document.getElementById('no-next-app-message');

            if (!app) {
                if (section) section.style.display = 'none';
                if (emptyMsg) emptyMsg.style.display = 'block';
                return;
            }

            if (section) section.style.display = 'block';
            if (emptyMsg) emptyMsg.style.display = 'none';

            // Actualizăm elementele cu ID-uri
            document.getElementById('focus-client-name').innerText = app.clientName;
            document.getElementById('focus-start-time').innerText = parseJavaTime(app.startTime);
            document.getElementById('focus-service-name').innerText = app.serviceName;
            document.getElementById('focus-tel').href = 'tel:' + app.phoneNumber;
            document.getElementById('focus-whatsapp').href = 'https://wa.me/40' + app.phoneNumber;
        })
        .catch(err => console.log("Nu sunt programări viitoare."));
}

// 2. LOGICA DE CALENDAR
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar-full');
    const container = document.getElementById('appointments-container');
    const titleSpan = document.querySelector('#selected-date-title span');

    if (!calendarEl) return;

    window.fetchAppointments = function(dateStr) {
        titleSpan.innerText = dateStr;
        container.innerHTML = '<div>⏳ Se încarcă...</div>';

        fetch(`/dashboard/appointments-by-date?date=${dateStr}`)
            .then(res => res.json())
            .then(data => {
                calendar.getEvents().forEach(e => e.remove());
                container.innerHTML = data.length === 0 ? '<div class="empty-state">☕ Nicio programare.</div>' : '';

                data.forEach(app => {
                    renderAppointmentCard(app);
                    calendar.addEvent({
                        id: app.id,
                        title: `${app.clientName} - ${app.serviceName}`,
                        start: app.startTime,
                        backgroundColor: app.status === 'CONFIRMED' ? '#4CAF50' : app.status === 'COMPLETED' ? '#d4af37' : '#FFC107'
                    });
                });
            })
            .catch(err => {
            console.error("Eroare la încărcare:", err);
            container.innerHTML = '<div style="color:red;">❌ Eroare la încărcarea datelor.</div>';
        });
    }

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridDay',
        locale: 'ro',
        allDaySlot: false,
        slotMinTime: '08:00:00',
        slotMaxTime: '21:00:00',
        slotDuration: '00:30:00',
        slotLabelInterval: '00:30:00',
        height: 'auto',
        headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
        editable: true,
        eventLongPressDelay: 50,

        datesSet: (info) => {
            const dateStr = info.startStr.split('T')[0];
            window.fetchAppointments(dateStr);
        },

        eventDrop: (info) => {
            // FIX TIMEZONE: Trimitem ora locală brută (fără conversie UTC)
            const date = info.event.start;
            const localTime = new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().slice(0, 19);

            const formData = new URLSearchParams();
            formData.append('newStart', localTime);

            fetch(`/dashboard/appointment/move/${info.event.id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(res => {
                if (!res.ok) { alert("Conflict de programare!"); info.revert(); }
                else window.fetchAppointments(localTime.split('T')[0]);
            });
        }
    });

    calendar.render();

    function renderAppointmentCard(app) {
        const timeStr = parseJavaTime(app.startTime);
        const statusClass = app.status ? app.status.toLowerCase() : 'pending';
        const card = document.createElement('div');
        card.className = 'appointment-card glass-effect';
        card.style.cssText = "position:relative; background:#1a1a1a; margin-bottom:12px; border-radius:12px; border:1px solid #333; overflow:hidden;";

        card.innerHTML = `
    <div class="status-indicator ${statusClass}" style="position:absolute; left:0; top:0; bottom:0; width:5px;"></div>
    <div style="padding: 15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:1.4rem; font-weight:800; color:#fff;">${timeStr}</span>
            <span style="color:#d4af37;">${app.price} RON</span>
        </div>
        <h4 style="margin:0; color:#eee;">${app.clientName}</h4>
        <div class="card-actions" style="display:flex; gap:8px; margin-top:12px; border-top:1px solid #222; padding-top:12px;">
            <a href="tel:${app.phoneNumber}" style="flex:1; text-align:center; background:#333; padding:8px; border-radius:6px; text-decoration:none;">📞</a>
            <button onclick="updateStatus(${app.id}, 'complete')" style="flex:1; background:rgba(76,175,80,0.2); color:#4CAF50; border:1px solid #4CAF50; border-radius:6px; cursor:pointer;">✅</button>
            <button onclick="updateStatus(${app.id}, 'cancel')" style="flex:1; background:rgba(244,67,54,0.1); color:#FFC107; border:1px solid #FFC107; border-radius:6px; cursor:pointer;">🚫</button>

            <button onclick="deleteAppointmentPermanently(${app.id})" style="flex:1; background:rgba(244,67,54,0.2); color:#F44336; border:1px solid #F44336; border-radius:6px; cursor:pointer;">🗑️</button>
        </div>
    </div>`;
        container.appendChild(card);
    }

    setInterval(updateFocusCard, 60000);
});
</script>

</body>
</html>
