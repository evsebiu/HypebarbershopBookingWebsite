<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | HypeBarbershop</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" th:href="@{/css/styles.css?v=125}">

    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

</head>

<body>

<div class="dashboard-header-compact" style="padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; position: sticky; top: 0; z-index: 50;">
    <div class="user-welcome">
        <span class="text-muted" style="font-size: 0.8rem;">Salut,</span>
        <h2 th:text="${currentUser}" style="margin:0; font-size: 1.1rem; color: #fff; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</h2>
    </div>

    <div style="display: flex; gap: 10px;">
        <a th:href="@{/dashboard/schedule}" class="btn-icon" style="background: rgba(212, 175, 55, 0.1); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.3); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; text-decoration: none;">
            🕒
        </a>
        <a th:href="@{/logout}" class="btn-icon" style="background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; text-decoration: none;">
            ⏻
        </a>
    </div>
</div>

<main class="dashboard-container" style="padding: 0 15px;">

    <div id="tab-appointments" class="tab-content active">
        <div class="dashboard-card glass-effect" style="padding: 10px; border-radius: 15px; margin-bottom: 20px;">
            <div id='calendar-full'></div>
        </div>

        <h4 id="selected-date-title" style="text-align: center; margin: 15px 0; color: #d4af37; font-size: 0.9rem;">
            Detalii zi: <span></span>
        </h4>
        <div id="appointments-container" class="appointments-grid"></div>

        <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; font-size: 0.75rem; color: #aaa;">
            <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; background: #FFC107; border-radius: 50%;"></span> Pending</span>
            <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; background: #4CAF50; border-radius: 50%;"></span> Confirmed</span>
            <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; background: #d4af37; border-radius: 50%;"></span> Completed</span>
        </div>

        <h3 class="section-divider-title" style="color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">Urmează</h3>

        <div class="appointments-grid" style="display: flex; flex-direction: column; gap: 15px;">

            <div th:if="${#lists.isEmpty(myAppointments)}" class="empty-state" style="text-align: center; padding: 30px; color: #666; border: 1px dashed #333; border-radius: 10px;">
                ☕ Nu ai programări viitoare.
            </div>

            <div th:each="app : ${myAppointments}" class="appointment-card glass-effect" style="position: relative; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333;">

                <div class="status-indicator" th:classappend="${app.status != null ? app.status.name().toLowerCase() : 'pending'}"
                     style="position: absolute; left: 0; top: 0; bottom: 0; width: 5px;"></div>

                <div class="card-content" style="padding: 15px 15px 15px 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div style="display: flex; align-items: baseline; gap: 5px;">
                            <span class="app-time" th:text="${#temporals.format(app.startTime, 'HH:mm')}" style="font-size: 1.5rem; font-weight: 700; color: #fff;">14:00</span>
                            <span class="app-date" th:text="${#temporals.format(app.startTime, 'dd MMM')}" style="font-size: 0.8rem; color: #888; text-transform: uppercase;">12 FEB</span>
                        </div>
                        <div class="price-tag" th:text="${app.price} + ' RON'" style="background: rgba(212, 175, 55, 0.1); color: #d4af37; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.9rem;">50 RON</div>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <h4 th:text="${app.clientName}" style="margin: 0 0 5px 0; color: #eee; font-size: 1.1rem;">Nume Client</h4>
                        <p style="margin: 0; color: #888; font-size: 0.9rem;">✂️ <span th:text="${app.serviceName}">Tuns</span></p>
                    </div>

                    <div class="card-actions" style="display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333;">
                        <a th:href="'https://wa.me/40' + ${#strings.replace(app.phoneNumber, ' ', '')}" class="btn-icon" target="_blank" style="flex: 1; background: #1e3a2a; color: #4CAF50; border: none; padding: 8px; border-radius: 6px; text-align: center;">📱</a>
                        <a th:href="'tel:' + ${app.phoneNumber}" class="btn-icon" style="flex: 1; background: #333; color: #fff; border: none; padding: 8px; border-radius: 6px; text-align: center;">📞</a>

                        <form th:if="${app.status != null and app.status.name() == 'PENDING'}"
                              th:action="@{/dashboard/appointment/confirm/{id}(id=${app.id})}" method="post" style="flex: 1;">
                            <button type="submit" style="width: 100%; background: rgba(33, 150, 243, 0.1); color: #2196F3; border: 1px solid rgba(33, 150, 243, 0.3); padding: 8px; border-radius: 6px; cursor: pointer;">✔️</button>
                        </form>

                        <form th:if="${app.status != null and app.status.name() == 'CONFIRMED'}"
                              th:action="@{/dashboard/appointment/complete/{id}(id=${app.id})}" method="post" style="flex: 1;">
                            <button type="submit" style="width: 100%; background: rgba(76, 175, 80, 0.1); color: #4CAF50; border: 1px solid rgba(76, 175, 80, 0.3); padding: 8px; border-radius: 6px; cursor: pointer;">✅</button>
                        </form>

                        <form th:if="${app.status != null and app.status.name() != 'CANCELED' and app.status.name() != 'COMPLETED'}"
                              th:action="@{/dashboard/appointment/cancel/{id}(id=${app.id})}" method="post"
                              onsubmit="return confirm('Sigur anulezi?');" style="flex: 1;">
                            <button type="submit" style="width: 100%; background: rgba(244, 67, 54, 0.1); color: #F44336; border: 1px solid rgba(244, 67, 54, 0.3); padding: 8px; border-radius: 6px; cursor: pointer;">❌</button>
                        </form>

                        <a th:href="@{/dashboard/appointment/edit/{id}(id=${app.id})}" style="width: 30px; display: flex; align-items: center; justify-content: center; color: #d4af37;">✏️</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="tab-services" class="tab-content" style="display: none;">
        <h3 class="section-divider-title" style="color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">✂️ Servicii</h3>

        <div class="dashboard-card glass-effect" style="background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333;">
            <h4 style="color: #d4af37; margin: 0 0 15px 0;">Adaugă Serviciu</h4>
            <form th:action="@{/dashboard/services/add}" method="post">
                <input type="text" name="serviceName" placeholder="Nume Serviciu" required
                       style="width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; margin-bottom: 10px;">

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="number" name="price" placeholder="Preț (RON)" required
                           style="flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px;">
                    <input type="number" name="duration" placeholder="Min" required
                           style="flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px;">
                </div>
                <button type="submit" class="btn-cta" style="width: 100%; padding: 12px; background: #d4af37; color: #000; font-weight: bold; border: none; border-radius: 6px;">SALVEAZĂ</button>
            </form>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div th:each="service : ${myServices}" class="glass-effect" style="background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 th:text="${service.serviceName}" style="margin: 0; color: #eee;">Tuns</h4>
                    <span style="font-size: 0.8rem; color: #888;">⏱️ <span th:text="${service.duration}">30</span> min</span>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="color: #d4af37; font-weight: bold; font-size: 1.1rem;" th:text="${service.price} + ' RON'">50</span>
                    <form th:action="@{/dashboard/services/delete/{id}(id=${service.id})}" method="post" style="margin:0;">
                        <button type="submit" style="background: rgba(244, 67, 54, 0.1); color: #F44336; border: 1px solid rgba(244, 67, 54, 0.3); width: 35px; height: 35px; border-radius: 8px; cursor: pointer;">🗑️</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <div th:if="${isAdminView}" id="tab-admin" class="tab-content" style="display: none;">
        <h3 class="section-divider-title" style="color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">👥 Echipa</h3>

        <div class="dashboard-card glass-effect" style="background: #1a1a1a; padding: 10px; border-radius: 12px; border: 1px solid #333;">
            <div class="table-responsive">
                <table class="barbers-table" style="width: 100%; border-collapse: collapse; color: #ddd;">
                    <thead>
                    <tr style="border-bottom: 1px solid #333;">
                        <th style="text-align: left; padding: 10px; color: #d4af37;">Nume</th>
                        <th style="text-align: left; padding: 10px; color: #d4af37;">Status</th>
                        <th style="text-align: right; padding: 10px; color: #d4af37;">Acțiune</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="barber : ${allBarbers}" style="border-bottom: 1px solid #222;">
                        <td th:text="${barber.firstName}" style="padding: 15px 10px;">Nume</td>
                        <td style="padding: 15px 10px;">
                                <span th:text="${barber.isActive ? 'Activ' : 'Inactiv'}"
                                      th:style="${barber.isActive ? 'color:#4CAF50' : 'color:#F44336'}">Status</span>
                        </td>
                        <td style="padding: 15px 10px; text-align: right;">
                            <form th:action="@{/admin/barbers/toggle/{id}(id=${barber.id})}" method="post" style="margin:0;">
                                <button style="background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 4px;">Switch</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div style="height: 100px;"></div>

</main>


<nav class="bottom-nav glass-effect" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(212, 175, 55, 0.2); display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);">

    <button class="nav-item active" onclick="switchTab('tab-appointments', this)" style="background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;">
        <span class="nav-icon" style="font-size: 1.4rem;">📅</span>
        <span class="nav-label" style="font-size: 0.7rem;">Calendar</span>
    </button>

    <button class="nav-item" onclick="switchTab('tab-services', this)" style="background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;">
        <span class="nav-icon" style="font-size: 1.4rem;">✂️</span>
        <span class="nav-label" style="font-size: 0.7rem;">Servicii</span>
    </button>

    <button th:if="${isAdminView}" class="nav-item" onclick="switchTab('tab-admin', this)" style="background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;">
        <span class="nav-icon" style="font-size: 1.4rem;">👥</span>
        <span class="nav-label" style="font-size: 0.7rem;">Echipă</span>
    </button>
</nav>

<script>
    // 1. FUNCȚII GLOBALE (Trebuie să fie în afara DOMContentLoaded pentru a fi accesibile de butoane)
function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

    document.getElementById(tabId).style.display = 'block';
    btnElement.classList.add('active');
}

// Transformă [2026, 2, 5, 14, 30] în "14:30" pentru UI-ul listei
function parseJavaTime(startTime) {
    if (!startTime) return "00:00";
    if (Array.isArray(startTime)) {
        return `${String(startTime[3]).padStart(2, '0')}:${String(startTime[4]).padStart(2, '0')}`;
    }
    if (typeof startTime === 'string') {
        return startTime.includes('T') ? startTime.split('T')[1].substring(0, 5) : startTime.substring(11, 16);
    }
    return "00:00";
}

// Transformă [2026, 2, 5, 14, 30] în format ISO pentru FullCalendar
function formatIsoForCalendar(startTime) {
    if (Array.isArray(startTime)) {
        const [y, m, d, h, min] = startTime;
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}T${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}:00`;
    }
    return startTime;
}

// 2. INIȚIALIZARE CALENDAR ȘI LOGICĂ DATE
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar-full');
    const container = document.getElementById('appointments-container');
    const titleSpan = document.querySelector('#selected-date-title span');

    if (!calendarEl) return;

    const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'timeGridDay',
    locale: 'ro',
    allDaySlot: false,
    slotMinTime: '08:00:00',
    slotMaxTime: '21:00:00',
    height: 'auto',
    headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
    editable: true,

    // --- FIX PENTRU MOBIL ---
    eventLongPressDelay: 50, // Activează mutarea după o apăsare de 50ms
    selectLongPressDelay: 50,
    longPressDelay: 50,
    // ------------------------

    datesSet: function(info) {
        const dateStr = info.startStr.split('T')[0];
        fetchAppointments(dateStr);
    },

    eventDrop: function(info) {
        // ... logica existentă de mutare rămâne neschimbată ...
        // Se va apela DashboardController.moveAppointment
    }
});

    calendar.render();
function parseJavaTime(startTime) {
    if (!startTime) return "00:00";
    if (typeof startTime === 'string' && startTime.includes('T')) {
        return startTime.split('T')[1].substring(0, 5);
    }
    // Fallback pentru formatul vechi array dacă jackson se resetează
    if (Array.isArray(startTime)) {
        return `${String(startTime[3]).padStart(2, '0')}:${String(startTime[4]).padStart(2, '0')}`;
    }
    return "00:00";
}

    function fetchAppointments(dateStr) {
    titleSpan.innerText = dateStr;
    container.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">⏳ Se încarcă...</div>';

    fetch(`/dashboard/appointments-by-date?date=${dateStr}`)
        .then(res => res.json())
        .then(data => {
            calendar.getEvents().forEach(e => e.remove());
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="empty-state">☕ Nicio programare azi.</div>';
                return;
            }

            data.forEach(app => {
                // Afișare în lista de jos
                renderAppointmentCard(app);

                // Afișare în grila calendarului
                calendar.addEvent({
                    id: app.id,
                    title: `${app.clientName} - ${app.serviceName}`,
                    start: app.startTime, // Acum este un string ISO valid: "2026-02-05T14:30:00"
                    backgroundColor: app.status === 'CONFIRMED' ? '#4CAF50' :
                                    app.status === 'COMPLETED' ? '#d4af37' : '#FFC107',
                    borderColor: 'transparent'
                    });
                });
            })
            .catch(err => {
                console.error("Eroare:", err);
                container.innerHTML = '<div style="color:red; text-align:center;">Eroare la încărcare.</div>';
            });
    }

    function renderAppointmentCard(app) {
        const timeStr = parseJavaTime(app.startTime);
        const statusClass = app.status ? app.status.toLowerCase() : 'pending';

        const card = document.createElement('div');
        card.className = 'appointment-card glass-effect';
        card.style.cssText = "position:relative; background:#1a1a1a; margin-bottom:12px; border-radius:12px; border:1px solid #333; overflow:hidden;";

        card.innerHTML = `
            <div class="status-indicator ${statusClass}" style="position:absolute; left:0; top:0; bottom:0; width:5px;"></div>
            <div style="padding: 15px 15px 15px 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="font-size:1.4rem; font-weight:800; color:#fff;">${timeStr}</span>
                    <span style="font-size:0.9rem; color:#d4af37; background:rgba(212,175,55,0.1); padding:4px 8px; border-radius:6px; font-weight:600;">${app.price} RON</span>
                </div>
                <h4 style="margin:0; color:#eee; font-size:1.1rem;">${app.clientName}</h4>
                <p style="margin:4px 0 12px 0; color:#888; font-size:0.9rem;">✂️ ${app.serviceName}</p>
            </div>`;
        container.appendChild(card);
    }
});
</script>

</body>
</html>
